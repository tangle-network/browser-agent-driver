name: Changesets

# Changesets opens the version PR, then tags its merged version and dispatches
# publish-npm.yml. npm trusts that workflow filename for OIDC publishing.
# GITHUB_TOKEN tag pushes do not trigger downstream push workflows; dispatch
# is intentional. Human tag pushes and manual dispatch remain publish fallbacks.

on:
  push:
    branches:
      - main

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # bump package.json + CHANGELOG.md, push the tag
  pull-requests: write  # open + update the Version Packages PR
  id-token: write       # OIDC token for npm trusted publishing + provenance
  actions: write        # gh workflow run publish-npm.yml (cross-workflow dispatch)

jobs:
  release:
    name: Version or Publish
    if: github.repository == 'tangle-network/browser-agent-driver'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so changesets can read all unreleased entries
          # and so the tag push points at the right commit.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@v1
        with:
          # The script that runs when consumed changesets are merged to
          # main (the Version Packages PR was just merged). It creates the
          # vX.Y.Z and browser-agent-driver-vX.Y.Z tags and pushes both.
          publish: pnpm release-tag
          # The script that updates package.json + CHANGELOG.md and
          # creates/updates the Version Packages PR. Also refreshes the
          # lockfile so the PR builds cleanly.
          version: pnpm version-packages
          title: 'Release: version packages'
          commit: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dispatch only after tagging, on the created version tag rather than
      # a later main commit. Keep publish in the npm-trusted workflow file.
      - name: Trigger publish workflow
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Triggering publish-npm.yml for version $VERSION"
          gh workflow run publish-npm.yml --ref "browser-agent-driver-v${VERSION}" -f version="$VERSION"
