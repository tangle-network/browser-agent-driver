# Post-merge safety net. NOT the merge gate.
#
# The merge gate is `pnpm signoff --source head`, run locally against the exact
# commit that will merge; `docs/SIGNOFF.md` states what that proves, what it
# cannot, and the rule that a merge with no valid proof is a defect. This
# workflow no longer triggers on `pull_request`, so it can never block a
# person waiting on a pull request.
#
# The `build` job's step list and `signoff.config.mjs` are the same commands
# on purpose for the Node 22 leg. Adding a step here without adding it there
# makes the sign-off proof a weaker claim than it reads as. The Node 20 leg of
# this matrix has no local equivalent — the gate pins Node 22 only, so a
# Node-20-only regression is caught here, post-merge, and nowhere earlier.
name: CI
on:
  push:
    branches: [main]

jobs:
  build:
    name: Post-merge safety net
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 is EOL (2025-04) and unsupported by the toolchain: the vitest
        # security bump (>=4.1.0, fixes GHSA critical) and vite 7 both require
        # Node ^20.19 || >=22.12. Test on supported LTS only.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  # The safety net's output. A red post-merge run is a real defect on `main`
  # and somebody has to own it, but nobody is standing in front of it waiting
  # — the merge already happened. So it files an issue instead of being a red
  # tick on a pull request nobody can merge past.
  #
  # One rolling issue, not one per push: a failing `main` usually fails
  # several pushes in a row, and a fresh issue each time buries the first one,
  # which is the one carrying the commit that broke it. `tier1-gate.yml` and
  # `tier2-staging-gate.yml` file into this SAME issue title, so one place
  # tracks every post-merge gate.
  safety-net-issue:
    name: File the safety-net failure
    needs: [build]
    if: always() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or append the safety-net failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Post-merge safety net is red on main'
          body="$(printf '%s\n' \
            "Commit \`${SHA}\` failed the post-merge CI safety net (\`ci.yml\` build job)." \
            "" \
            "- run: ${RUN_URL}" \
            "- pushed by: @${ACTOR}" \
            "" \
            "Reproduce the Node 22 leg locally with the merge gate:" \
            "" \
            '```' \
            "git fetch origin && git checkout ${SHA}" \
            "nvm use && pnpm signoff --source head" \
            '```' \
            "" \
            "If the gate passes here and failed on the runner, that difference is the finding." \
            "The Node 20 matrix leg has no local equivalent — the gate pins Node 22 only." \
            "See \`docs/SIGNOFF.md\` for what the local gate cannot prove.")"
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "appended to issue #$number"
          else
            gh issue create --title "$title" --body "$body"
          fi
